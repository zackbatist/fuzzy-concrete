on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout with LFS enabled
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Materialize LFS files
      - name: Pull LFS files
        run: |
          git lfs install
          git lfs pull

      # Verify LFS files are materialized
      - name: Verify LFS files
        run: |
          echo "LFS files tracked:"
          git lfs ls-files
          if grep -RIl "version https://git-lfs.github.com/spec" assets 2>/dev/null; then
            echo "::error::Found LFS pointer files - LFS checkout failed"
            exit 1
          fi

      # Set up Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Install TinyTeX if needed
      - name: Install TinyTeX
        run: quarto install tinytex

      # Configure git to ignore rendered output
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      # Render the single qmd file (this uses your LFS files)
      # Note: embed-resources: true makes this a large self-contained HTML
      - name: Render Quarto document
        run: |
          # Remove any LFS-tracked HTML that was checked out
          rm -f fuzzy-concrete.html
          # Render fresh - creates large self-contained HTML with embedded resources
          quarto render fuzzy-concrete.qmd
          # Verify we have a real HTML file, not an LFS pointer
          if grep -q "version https://git-lfs.github.com/spec" fuzzy-concrete.html; then
            echo "::error::Rendered file is still an LFS pointer!"
            exit 1
          fi
          echo "Successfully rendered $(du -h fuzzy-concrete.html | cut -f1) HTML file"
          
      # Deploy the rendered HTML directly
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          destination_dir: ./
          keep_files: false
          # Only include the files we want to deploy
          exclude_assets: '.git*,.github,*.qmd,*.rmd,_quarto.yml'