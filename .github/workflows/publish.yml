on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout with LFS enabled
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Materialize LFS files
      - name: Pull LFS files
        run: |
          git lfs install
          git lfs pull

      # Verify LFS files are materialized
      - name: Verify LFS files
        run: |
          echo "LFS files tracked:"
          git lfs ls-files
          if grep -RIl "version https://git-lfs.github.com/spec" assets 2>/dev/null; then
            echo "::error::Found LFS pointer files - LFS checkout failed"
            exit 1
          fi

      # Set up Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Install TinyTeX if needed
      - name: Install TinyTeX
        run: quarto install tinytex

      # Render the single qmd file (this uses your LFS files)
      - name: Render Quarto document
        run: |
          rm -f fuzzy-concrete.html fuzzy-concrete.pdf
          quarto render fuzzy-concrete.qmd
          
      # Prepare deployment directory
      - name: Prepare deployment
        run: |
          mkdir -p _deploy
          cp fuzzy-concrete.html _deploy/index.html
          # Copy PDF to root of deployment
          if [ -f "fuzzy-concrete.pdf" ]; then
            cp fuzzy-concrete.pdf _deploy/fuzzy-concrete.pdf
          fi
          # Copy supporting files (dereferencing any LFS)
          if [ -d "fuzzy-concrete_files" ]; then
            cp -rL fuzzy-concrete_files _deploy/
          fi
          # Copy figures directory (dereferencing LFS)
          if [ -d "figures" ]; then
            echo "Copying figures with LFS dereferencing..."
            cp -rL figures _deploy/
          fi
          # Copy sections directory if referenced in HTML
          if [ -d "sections" ]; then
            echo "Copying sections..."
            cp -rL sections _deploy/
          fi
          
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          keep_files: false